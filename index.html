<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽譜読み込み＆演奏プレイヤー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      max-width: 600px;
      width: 100%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
      color: #1a73e8;
    }
    .upload-section {
      border: 2px dashed #4285f4;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background-color: #f8f9fa;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .upload-section:hover {
      background-color: #e8f0fe;
    }
    input[type="file"] {
      display: none;
    }
    .preview-img {
      max-width: 100%;
      max-height: 200px;
      margin-top: 15px;
      border-radius: 4px;
      display: none;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn-primary {
      background-color: #1a73e8;
      color: white;
    }
    .btn-primary:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .btn-danger {
      background-color: #ea4335;
      color: white;
    }
    .btn-danger:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .status {
      font-size: 0.9rem;
      color: #666;
      text-align: center;
      margin-bottom: 15px;
      min-height: 1.2em;
    }
    .notes-display {
      background: #f1f3f4;
      padding: 15px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9rem;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>楽譜読み込み & 演奏プレイヤー</h1>
  
  <div class="upload-section" onclick="document.getElementById('fileInput').click()">
    <p>📄 楽譜画像（またはABC表記テキスト画像）をアップロード</p>
    <small>（クリックして画像を選択）</small>
    <input type="file" id="fileInput" accept="image/*">
    <br>
    <img id="preview" class="preview-img" alt="楽譜プレビュー">
  </div>

  <div class="status" id="statusText">ファイルを待機中...</div>

  <div class="controls">
    <button id="playBtn" class="btn-primary" disabled>▶ 再生</button>
    <button id="stopBtn" class="btn-danger" disabled>■ 停止</button>
  </div>

  <div class="notes-display">
    <strong>解析された音符データ:</strong>
    <p id="parsedNotes">（画像を選択すると自動解析されます）</p>
  </div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const statusText = document.getElementById('statusText');
  const parsedNotesText = document.getElementById('parsedNotes');
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');

  let parsedSequence = [];
  let synth = null;
  let isPlaying = false;

  // ファイル選択時処理
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // 画像プレビュー表示
    const reader = new FileReader();
    reader.onload = (event) => {
      preview.src = event.target.result;
      preview.style.display = 'block';
    };
    reader.readAsDataURL(file);

    statusText.innerText = "画像を解析中...";
    playBtn.disabled = true;

    try {
      // Tesseract.js による簡易OCR（テキスト/文字解析例）
      const result = await Tesseract.recognize(file, 'eng');
      const text = result.data.text.toUpperCase();
      
      // 画像から「C D E F G A B」などの音符文字を検出してデータ化する簡易ロジック
      parsedSequence = parseTextToNotes(text);

      if (parsedSequence.length === 0) {
        // 画像から音符がうまく判定できなかった場合のフォールバック（デモ用デフォルトメロディ）
        parsedSequence = [
          { note: "C4", duration: "4n" },
          { note: "E4", duration: "4n" },
          { note: "G4", duration: "4n" },
          { note: "C5", duration: "2n" }
        ];
        statusText.innerText = "画像の文字解析完了（デフォルトメロディを読み込みました）";
      } else {
        statusText.innerText = "楽譜データの解析完了！";
      }

      parsedNotesText.innerText = parsedSequence.map(n => `${n.note}(${n.duration})`).join(" -> ");
      playBtn.disabled = false;

    } catch (err) {
      statusText.innerText = "解析エラーが発生しました。";
      console.error(err);
    }
  });

  // テキストからの音符抽出処理（ABC表記等の文字判定デモ）
  function parseTextToNotes(text) {
    const validNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
    const sequence = [];

    for (let char of text) {
      if (validNotes.includes(char)) {
        sequence.push({
          note: `${char}4`,
          duration: "4n"
        });
      }
    }
    return sequence;
  }

  // 再生ボタン
  playBtn.addEventListener('click', async () => {
    await Tone.start();
    if (!synth) {
      synth = new Tone.Synth().toDestination();
    }

    playBtn.disabled = true;
    stopBtn.disabled = false;
    statusText.innerText = "演奏中...";

    let now = Tone.now();
    parsedSequence.forEach((item) => {
      synth.triggerAttackRelease(item.note, item.duration, now);
      now += Tone.Time(item.duration).toSeconds();
    });

    const totalTime = (now - Tone.now()) * 1000;
    setTimeout(() => {
      resetPlayer();
    }, totalTime);
  });

  // 停止ボタン
  stopBtn.addEventListener('click', () => {
    resetPlayer();
  });

  function resetPlayer() {
    playBtn.disabled = false;
    stopBtn.disabled = true;
    statusText.innerText = "再生停止";
  }
</script>
</body>
</html>
