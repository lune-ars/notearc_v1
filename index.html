<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tone.js 楽譜プレイヤー</title>
  <!-- Tone.js の読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    button {
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      margin: 0.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    button#stopBtn {
      background-color: #dc3545;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>簡易メロディプレイヤー</h2>
    <p>「ドレミファソラシド」を再生します</p>
    <button id="playBtn">再生</button>
    <button id="stopBtn" disabled>停止</button>
  </div>

  <script>
    // 楽譜データ（音符と長さのシーケンス）
    // note: 音高（例: C4=ド, D4=レ）
    // duration: 音の長さ（4n=4分音符, 8n=8分音符）
    const score = [
      { note: "C4", duration: "4n" },
      { note: "D4", duration: "4n" },
      { note: "E4", duration: "4n" },
      { note: "F4", duration: "4n" },
      { note: "G4", duration: "4n" },
      { note: "A4", duration: "4n" },
      { note: "B4", duration: "4n" },
      { note: "C5", duration: "2n" }
    ];

    const synth = new Tone.Synth().toDestination();
    let isPlaying = false;

    const playBtn = document.getElementById("playBtn");
    const stopBtn = document.getElementById("stopBtn");

    playBtn.addEventListener("click", async () => {
      // Web Audio APIのコンテキストをユーザー操作で開始
      await Tone.start();
      
      playBtn.disabled = true;
      stopBtn.disabled = false;
      isPlaying = true;

      let now = Tone.now();

      score.forEach((item, index) => {
        // 音をスケジュール再生
        synth.triggerAttackRelease(item.note, item.duration, now);
        
        // 次の音の開始位置を計算
        now += Tone.Time(item.duration).toSeconds();
      });

      // 最後の音が鳴り終わったらボタン状態を元に戻す
      const totalDuration = now - Tone.now();
      setTimeout(() => {
        resetButtons();
      }, totalDuration * 1000);
    });

    stopBtn.addEventListener("click", () => {
      // 再生を停止・全音消音
      Tone.Transport.stop();
      Tone.Transport.cancel();
      synth.releaseAll ? synth.releaseAll() : null;
      resetButtons();
    });

    function resetButtons() {
      playBtn.disabled = false;
      stopBtn.disabled = true;
      isPlaying = false;
    }
  </script>
</body>
</html>
